apply plugin: "com.android.library"

group = "io.hyperswitch"
version = sdkVersion

android {
    namespace 'io.hyperswitch.app'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        buildTypes.all { buildType ->
            if (!['debug', 'release'].contains(buildType.name)) {
                buildType.matchingFallbacks = ['debug', 'release']
            }
        }
    }
}

// This module is the single artifact merchants integrate with
// (published as `hyperswitch-sdk-android`) — it carries no code of its
// own, it just aggregates the SDK's React Native runtime and its optional
// feature modules so consumers only need one dependency.
dependencies {
    api project(':hyperswitch-sdk-android-react-native')
    api project(':hyperswitch-sdk-android-payment-methods')
}
